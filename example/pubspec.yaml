name: adaptive_dual_camera_example
description: "Demonstrates how to use the adaptive_dual_camera plugin."
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # A real app depends on the published version instead:
  #   adaptive_dual_camera: ^0.8.0
  adaptive_dual_camera:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
