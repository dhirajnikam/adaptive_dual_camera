name: adaptive_dual_camera
description: "Guided front-then-back photo capture with location and timestamp, composed from the official camera and geolocator plugins. Pure Dart, no custom native code, tuned for low-end devices."
version: 0.1.0
homepage: https://github.com/dhirajnikam/adaptive_dual_camera
repository: https://github.com/dhirajnikam/adaptive_dual_camera
issue_tracker: https://github.com/dhirajnikam/adaptive_dual_camera/issues

topics:
  - camera
  - photo
  - geolocation
  - dualcamera

environment:
  sdk: ^3.12.2
  flutter: '>=3.27.0'

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
