name: adaptive_dual_camera
description: "Hands-free front + back photo capture with location and timestamp — simultaneous where the hardware allows it, sequential where it doesn't, same layout either way. Pure Dart, no custom native code."
version: 0.4.0
homepage: https://github.com/dhirajnikam/adaptive_dual_camera
repository: https://github.com/dhirajnikam/adaptive_dual_camera
issue_tracker: https://github.com/dhirajnikam/adaptive_dual_camera/issues

topics:
  - camera
  - photo
  - geolocation
  - dualcamera

environment:
  sdk: ^3.12.2
  flutter: '>=3.27.0'

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  geolocator: ^14.0.3

dev_dependencies:
  # Lets the tests swap in a fake camera; ships with `camera` at runtime.
  camera_platform_interface: ^2.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
