name: adaptive_dual_camera
description: "Hands-free front + back photo capture with location and timestamp — native simultaneous capture where the hardware allows it, sequential everywhere else, and the same composed layout either way."
version: 0.5.0
homepage: https://github.com/dhirajnikam/adaptive_dual_camera
repository: https://github.com/dhirajnikam/adaptive_dual_camera
issue_tracker: https://github.com/dhirajnikam/adaptive_dual_camera/issues

topics:
  - camera
  - photo
  - geolocation
  - dualcamera

environment:
  sdk: ^3.12.2
  # 3.44 is the floor for Built-in Kotlin, which the Android probe relies on.
  flutter: '>=3.44.0'

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  geolocator: ^14.0.3

dev_dependencies:
  # Lets the tests swap in a fake camera; ships with `camera` at runtime.
  camera_platform_interface: ^2.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # The only native code in the package: a capability probe that answers
      # "can this device run both cameras at once?". Capture stays pure Dart.
      android:
        package: com.dhirajnikam.adaptive_dual_camera
        pluginClass: AdaptiveDualCameraPlugin
      ios:
        pluginClass: AdaptiveDualCameraPlugin
